<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VCF test login page</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 26rem; margin: 3rem auto; color: #222; }
    form { display: flex; flex-direction: column; gap: 0.6rem; border: 1px solid #ddd; border-radius: 8px; padding: 1.2rem; }
    label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }
    input { padding: 0.5rem; font-size: 0.95rem; }
    button { padding: 0.5rem; cursor: pointer; margin-top: 0.4rem; }
    #result { margin-top: 1rem; font-size: 0.85rem; white-space: pre-wrap; background: #f6f6f6; padding: 0.6rem; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h1>VCF test login page</h1>
  <p>
    Matches the <code>secret/perso/local-test</code> fixture seeded by
    <code>dev/seed/seed.sh</code> (tagged <code>url=http://localhost:8080</code>).
    Serve this file at exactly that address to test the extension end
    to end — see the README's "Local Vault and OpenBao" section.
  </p>
  <form id="login">
    <label>Username <input type="text" name="username" autocomplete="username" /></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" /></label>
    <button type="submit">Sign in</button>
  </form>
  <pre id="result"></pre>
  <script>
    // No real backend — just proves the fill actually reached the
    // form's values (not just visually, but read back via .value).
    document.getElementById('login').addEventListener('submit', (e) => {
      e.preventDefault()
      const form = new FormData(e.target)
      const result = document.getElementById('result')
      result.style.display = 'block'
      result.textContent = 'Submitted:\n  username: ' + form.get('username') + '\n  password: ' + form.get('password')
    })
  </script>
</body>
</html>
