name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the current LTS; 24 catches breakage early.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` fails loudly when package-lock.json drifts from
      # package.json, which is what we want in CI.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Chrome and Firefox
        run: npm run build && npm run build:firefox

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration (Vault + OpenBao)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start and seed servers
        run: docker compose -f dev/docker-compose.yml up -d --wait

      - name: Test
        run: npm run test:integration

      - name: Server logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

      - name: Stop servers
        if: always()
        run: docker compose -f dev/docker-compose.yml down -v
